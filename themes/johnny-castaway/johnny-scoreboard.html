<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Johnny Castaway Scoreboard</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Arial', sans-serif;
      background: linear-gradient(180deg, #87CEEB 0%, #4A90E2 50%, #1E5A8E 100%);
      color: #2C3E50;
      overflow: hidden;
      width: 1920px;
      height: 1080px;
    }

    /* Container to clip overflow */
    #johnnyContainer {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 300px;
      overflow: hidden;
      background: #87CEEB;
    }
    
    /* Johnny Castaway iframe - scaled up to fill width */
    #johnnyFrame {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%) scale(2.2);
      width: 1200px;
      height: 300px;
      border: none;
      transform-origin: center top;
    }

    /* Header with Event + Clock */
    .header {
      position: absolute;
      top: 300px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 50px;
      background: rgba(255, 235, 156, 0.9);
      border-bottom: 3px solid #D4A574;
      border-top: 3px solid #D4A574;
    }

    .event-name {
      font-size: 40px;
      font-weight: 700;
      color: #2C3E50;
      text-shadow: 1px 1px 2px rgba(255, 255, 255, 0.5);
    }

    .race-clock {
      font-size: 70px;
      font-weight: 900;
      font-variant-numeric: tabular-nums;
      color: #E74C3C;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
    }

    /* Lane Results */
    .lanes-container {
      position: absolute;
      top: 390px;
      left: 0;
      right: 0;
      bottom: 60px;
      padding: 2px 50px 2px 50px;
      display: flex;
      flex-direction: column;
      gap: 2px;
      overflow: hidden;
    }

    .lane {
      display: grid;
      grid-template-columns: 80px 100px 360px 280px 220px 1fr;
      gap: 25px;
      align-items: center;
      background: rgba(255, 255, 255, 0.8);
      padding: 6px 120px 6px 40px;
      border-radius: 8px;
      border-left: 6px solid #3498DB;
      transition: all 0.3s ease;
      box-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
    }

    .lane-number {
      font-size: 56px;
      font-weight: 900;
      color: #3498DB;
      text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.2);
      text-align: center;
    }

    .place {
      font-size: 56px;
      font-weight: 900;
      color: #F39C12;
      text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.2);
      text-align: center;
    }

    .place.empty {
      opacity: 0;
    }

    .swimmer-name {
      font-size: 44px;
      font-weight: 700;
      color: #2C3E50;
      text-shadow: 1px 1px 1px rgba(255, 255, 255, 0.5);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .team {
      font-size: 40px;
      font-weight: 600;
      color: #34495E;
      text-shadow: 1px 1px 1px rgba(255, 255, 255, 0.5);
      opacity: 0.9;
    }

    .split-time {
      font-size: 48px;
      font-weight: 800;
      color: #9B59B6;
      text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.2);
      font-variant-numeric: tabular-nums;
      text-align: right;
    }

    .final-time {
      font-size: 58px;
      font-weight: 900;
      color: #27AE60;
      text-shadow: 2px 2px 3px rgba(0, 0, 0, 0.2);
      font-variant-numeric: tabular-nums;
      text-align: right;
    }

    .lane.first-place {
      background: rgba(255, 235, 156, 0.95);
      border-left-color: #F39C12;
      box-shadow: 0 4px 12px rgba(243, 156, 18, 0.4);
    }

    .lane.first-place .final-time {
      color: #F39C12;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
      font-size: 64px;
    }

    /* Footer */
    .footer {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      display: flex;
      justify-content: space-between;
      padding: 6px 40px;
      background: rgba(212, 165, 116, 0.9);
      border-top: 3px solid #A67C52;
    }

    .footer-item {
      font-size: 22px;
      font-weight: 600;
      color: #2C3E50;
      text-shadow: 1px 1px 1px rgba(255, 255, 255, 0.3);
    }

    .footer-label {
      color: #E74C3C;
      margin-right: 10px;
      font-weight: 700;
    }

    .footer-value {
      color: #2C3E50;
      font-weight: 600;
    }

    /* Fullscreen Button */
    .fullscreen-btn {
      position: fixed;
      top: 10px;
      right: 10px;
      background: #F39C12;
      color: #FFFFFF;
      border: 2px solid #E67E22;
      padding: 10px 20px;
      font-size: 16px;
      font-weight: 700;
      font-family: 'Arial', sans-serif;
      border-radius: 8px;
      cursor: pointer;
      z-index: 10000;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
      transition: all 0.3s ease;
    }

    .fullscreen-btn:hover {
      background: #E67E22;
      transform: scale(1.05);
      box-shadow: 0 6px 12px rgba(0, 0, 0, 0.4);
    }

    .fullscreen-btn.hidden {
      display: none;
    }
  </style>
</head>
<body>
  <!-- Fullscreen Button -->
  <button class="fullscreen-btn" id="fullscreenBtn" onclick="toggleFullscreen()">
    Enter Fullscreen (F11)
  </button>

  <!-- Johnny Castaway iframe (stretched to fill width) -->
  <div id="johnnyContainer">
    <iframe id="johnnyFrame" src="https://castaway.xesf.net" allow="autoplay"></iframe>
  </div>

  <!-- Scoreboard Header -->
  <div class="header">
    <div class="event-name" id="eventName">Event 12 - Girls 200 IM</div>
    <div class="race-clock" id="raceClock">0:00.00</div>
  </div>

  <!-- Lane Results -->
  <div class="lanes-container" id="lanesContainer">
    <!-- Lanes populated by JavaScript -->
  </div>

  <!-- Footer -->
  <div class="footer">
    <div class="footer-item">
      <span class="footer-label">EV:</span>
      <span class="footer-value" id="eventNumber">12</span>
    </div>
    <div class="footer-item">
      <span class="footer-label">HT:</span>
      <span class="footer-value" id="heatNumber">3 of 4</span>
    </div>
    <div class="footer-item">
      <span class="footer-label">Lengths:</span>
      <span class="footer-value" id="lengths">4</span>
    </div>
    <div class="footer-item">
      <span class="footer-label">Record:</span>
      <span class="footer-value" id="record">2:03.45</span>
    </div>
  </div>

  <script>
    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
        document.getElementById('fullscreenBtn').classList.add('hidden');
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
          document.getElementById('fullscreenBtn').classList.remove('hidden');
        }
      }
    }

    // Hide fullscreen button when in fullscreen
    document.addEventListener('fullscreenchange', () => {
      const btn = document.getElementById('fullscreenBtn');
      if (document.fullscreenElement) {
        btn.classList.add('hidden');
      } else {
        btn.classList.remove('hidden');
      }
    });

    // F11 key handler
    document.addEventListener('keydown', (e) => {
      if (e.key === 'F11') {
        e.preventDefault();
        toggleFullscreen();
      }
    });

    // ===== SCOREBOARD FUNCTIONALITY =====
    function updateLanes(lanes) {
      const container = document.getElementById('lanesContainer');
      container.innerHTML = '';
      
      lanes.forEach((lane, index) => {
        const laneDiv = document.createElement('div');
        laneDiv.className = 'lane';
        if (lane.place === 1) laneDiv.classList.add('first-place');
        
        const placeHTML = lane.place 
          ? `<div class="place">${lane.place}</div>` 
          : `<div class="place empty">-</div>`;
        
        laneDiv.innerHTML = `
          <div class="lane-number">${lane.lane}</div>
          ${placeHTML}
          <div class="swimmer-name">${lane.name || 'Athlete Name'}</div>
          <div class="team">${lane.team || 'Team'}</div>
          <div class="split-time">${lane.split || ''}</div>
          <div class="final-time">${lane.time || ''}</div>
        `;
        
        container.appendChild(laneDiv);
      });
    }

    // Demo lanes
    const demoLanes = [
      { lane: 1, name: 'Sarah Johnson', team: 'NOVA', split: '1:01.23', time: '2:08.45', place: null },
      { lane: 2, name: 'Emma Williams', team: 'RAYS', split: '59.87', time: '2:05.67', place: 3 },
      { lane: 3, name: 'Katie Martinez', team: 'TIDE', split: '58.34', time: '2:03.12', place: 1 },
      { lane: 4, name: 'Olivia Davis', team: 'WAVE', split: '59.12', time: '2:04.89', place: 2 },
      { lane: 5, name: 'Sophia Brown', team: 'HEAT', split: '1:00.45', time: '2:07.23', place: 4 },
      { lane: 6, name: 'Ava Garcia', team: 'BOLT', split: '1:01.89', time: '2:09.01', place: null },
      { lane: 7, name: 'Isabella Lopez', team: 'FAST', split: '1:02.34', time: '2:10.56', place: null },
      { lane: 8, name: 'Mia Rodriguez', team: 'FIRE', split: '1:00.78', time: '2:07.89', place: 5 },
    ];

    // Start
    updateLanes(demoLanes);
  </script>
</body>
</html>
