<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>LIAC Scoreboard - Long Island Aquatic Club</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    /* LIAC Theme Variables */
    :root {
      --liac-blue: #0069B3;
      --liac-dark-blue: #004070;
      --liac-light-blue: #4A90E2;
      --liac-red: #CE1126;
      --liac-accent: #FFFFFF;
      --text-primary: #FFFFFF;
      --text-green: #00FF00;
      --text-red: #FF1493;
      --text-yellow: #FFD700;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Roboto Condensed', 'Arial', sans-serif;
      background: linear-gradient(135deg, #0069B3 0%, #004070 100%);
      color: var(--text-primary);
      width: 1920px;
      height: 1080px;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    /* Header Section */
    .header-container {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      display: flex;
      gap: 20px;
      padding: 20px 40px 20px 40px;
      padding-right: 280px; /* Space for timer */
      z-index: 10;
    }

    .header-box {
      display: flex;
      align-items: center;
    }

    .header-box.fixed {
      flex: 0 0 auto;
    }

    .header-box.stretch {
      flex: 1;
    }

    .header-content {
      padding: 16px 32px;
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 8px;
      border: 3px solid var(--liac-red);
      animation: fadeIn 0.5s ease-out;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(-20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .label {
      font-weight: 700;
      font-size: 32px;
      letter-spacing: 1px;
      color: var(--text-green);
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
    }

    .value {
      font-weight: 900;
      font-size: 36px;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.6);
    }

    .event-name {
      font-weight: 900;
      font-size: 42px;
      letter-spacing: 1px;
      text-shadow: 0 3px 8px rgba(0, 0, 0, 0.5);
    }

    /* Timer Section - MOVED BELOW HEADER */
    .timer-container {
      position: absolute;
      top: 115px;
      right: 40px;
      z-index: 20;
    }

    .timer-content {
      padding: 12px 32px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      border: 4px solid var(--liac-red);
      animation: fadeIn 0.5s ease-out 0.1s backwards;
    }

    .timer-label {
      font-weight: 700;
      font-size: 20px;
      letter-spacing: 2px;
      color: var(--text-green);
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
    }

    .running-time {
      font-weight: 900;
      font-size: 52px;
      font-variant-numeric: tabular-nums;
      letter-spacing: -2px;
      color: var(--liac-accent);
      text-shadow: 
        0 0 20px var(--liac-light-blue),
        0 0 40px var(--liac-light-blue),
        0 4px 16px rgba(0, 0, 0, 0.7);
    }

    /* Lanes Section */
    .lanes-container {
      position: absolute;
      right: 40px;
      top: 220px;
      width: 1100px;
      height: 830px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      justify-content: space-between;
    }

    .lane-content {
      display: grid;
      grid-template-columns: 70px 70px 340px 160px 220px;
      gap: 10px;
      align-items: center;
      padding: 12px 20px;
      background: rgba(255, 255, 255, 0.12);
      border-radius: 8px;
      border-left: 6px solid var(--liac-red);
      animation: slideIn 0.5s ease-out backwards;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateX(50px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    .lane-content:hover {
      background: rgba(255, 255, 255, 0.2);
      transform: translateX(4px);
    }

    .lane-indicator {
      font-size: 40px;
      font-weight: 900;
      text-align: center;
      padding: 6px;
      color: var(--text-green);
      text-shadow: 0 4px 10px rgba(0, 0, 0, 0.8);
    }

    .place-indicator {
      font-size: 40px;
      font-weight: 900;
      text-align: center;
      color: var(--text-red);
      text-shadow: 0 4px 10px rgba(0, 0, 0, 0.8);
    }

    .place-indicator:empty {
      opacity: 0;
    }

    .swimmer-name {
      font-size: 28px;
      font-weight: 700;
      text-shadow: 0 4px 10px rgba(0, 0, 0, 0.7);
    }

    .split-time {
      font-size: 32px;
      font-weight: 700;
      text-align: right;
      color: var(--text-yellow);
      text-shadow: 0 4px 10px rgba(0, 0, 0, 0.8);
    }

    .final-time {
      font-size: 38px;
      font-weight: 900;
      text-align: right;
      color: var(--liac-accent);
      text-shadow: 0 5px 15px rgba(0, 0, 0, 0.9);
    }

    /* First Place Highlight */
    .lane-content.first-place {
      background: linear-gradient(135deg, rgba(255, 215, 0, 0.3), rgba(255, 165, 0, 0.3));
      border-left-color: #FFD700;
      box-shadow: 0 8px 24px rgba(255, 215, 0, 0.4);
    }

    .lane-content.first-place .final-time {
      color: #FFD700;
      font-size: 44px;
      animation: sparkle 2s ease-in-out infinite;
    }

    @keyframes sparkle {
      0%, 100% {
        text-shadow: 
          0 0 20px #FFD700,
          0 0 40px #FFD700,
          0 5px 15px rgba(0, 0, 0, 0.9);
      }
      50% {
        text-shadow: 
          0 0 30px #FFD700,
          0 0 60px #FFD700,
          0 0 80px #FFA500,
          0 5px 20px rgba(0, 0, 0, 0.9);
      }
    }

    /* Fullscreen Button */
    .fullscreen-btn {
      position: fixed;
      bottom: 20px;
      right: 20px;
      padding: 12px 24px;
      background: rgba(206, 17, 38, 0.8);
      border: 2px solid white;
      border-radius: 8px;
      color: white;
      font-weight: 700;
      font-size: 18px;
      cursor: pointer;
      z-index: 100;
      transition: all 0.3s ease;
    }

    .fullscreen-btn:hover {
      background: rgba(206, 17, 38, 1);
      transform: scale(1.05);
    }

    .fullscreen-btn.hidden {
      display: none;
    }
  </style>
</head>
<body>
  <!-- Header with Event Info -->
  <div class="header-container">
    <div class="header-box fixed">
      <div class="header-content">
        <span class="label">EVENT</span>
        <span class="value" id="eventNumber">12</span>
      </div>
    </div>
    <div class="header-box fixed">
      <div class="header-content">
        <span class="label">HEAT</span>
        <span class="value" id="heatNumber">3</span>
      </div>
    </div>
    <div class="header-box stretch">
      <div class="header-content" style="width: 100%;">
        <span class="event-name" id="eventName">200 FREESTYLE</span>
      </div>
    </div>
  </div>

  <!-- Timer Display -->
  <div class="timer-container">
    <div class="timer-content">
      <div class="timer-label">TIME</div>
      <div class="running-time" id="runningTime">2:34.5</div>
    </div>
  </div>

  <!-- Lane Results -->
  <div class="lanes-container" id="lanesContainer"></div>

  <!-- Fullscreen Button -->
  <button class="fullscreen-btn" id="fullscreenBtn" onclick="toggleFullscreen()">
    Enter Fullscreen (F11)
  </button>

  <script>
    // Sample race data
    const sampleLanes = [
      { lane: 1, place: 4, name: 'SMITH, JOHN', split: '55.1', time: '1:52.3' },
      { lane: 2, place: 1, name: 'JONES, SARAH', split: '54.2', time: '1:49.8' },
      { lane: 3, place: 5, name: 'WILLIAMS, MIKE', split: '54.7', time: '1:51.0' },
      { lane: 4, place: 2, name: 'BROWN, EMMA', split: '54.5', time: '1:50.4' },
      { lane: 5, place: 7, name: 'DAVIS, ALEX', split: '55.8', time: '1:53.2' },
      { lane: 6, place: 3, name: 'MILLER, CHRIS', split: '54.6', time: '1:50.9' },
      { lane: 7, place: 8, name: 'WILSON, KATIE', split: '56.2', time: '1:54.1' },
      { lane: 8, place: 6, name: 'MOORE, RYAN', split: '55.3', time: '1:52.6' },
      { lane: 9, place: 9, name: 'TAYLOR, LISA', split: '56.7', time: '1:55.4' },
      { lane: 10, place: 10, name: 'ANDERSON, TOM', split: '55.6', time: '1:53.8' }
    ];

    function renderLanes(lanes) {
      const container = document.getElementById('lanesContainer');
      container.innerHTML = '';
      
      lanes.forEach((lane, index) => {
        const laneDiv = document.createElement('div');
        laneDiv.className = 'lane-content';
        if (lane.place === 1) laneDiv.classList.add('first-place');
        laneDiv.style.animationDelay = `${index * 0.05}s`;
        
        laneDiv.innerHTML = `
          <div class="lane-indicator">${lane.lane}</div>
          <div class="place-indicator">${lane.place || ''}</div>
          <div class="swimmer-name">${lane.name}</div>
          <div class="split-time">${lane.split}</div>
          <div class="final-time">${lane.time}</div>
        `;
        
        container.appendChild(laneDiv);
      });
    }

    // Render sample data
    renderLanes(sampleLanes);

    // Timer animation (tenths only)
    let startTime = Date.now();
    function updateTimer() {
      const elapsed = (Date.now() - startTime) / 1000;
      const minutes = Math.floor(elapsed / 60);
      const seconds = (elapsed % 60).toFixed(1); // Changed to .1 for tenths
      document.getElementById('runningTime').textContent = 
        `${minutes}:${seconds.padStart(4, '0')}`;
      requestAnimationFrame(updateTimer);
    }
    // updateTimer(); // Uncomment to enable live timer

    // Fullscreen functionality
    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
        document.getElementById('fullscreenBtn').classList.add('hidden');
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
          document.getElementById('fullscreenBtn').classList.remove('hidden');
        }
      }
    }

    // Hide fullscreen button when in fullscreen
    document.addEventListener('fullscreenchange', () => {
      const btn = document.getElementById('fullscreenBtn');
      if (document.fullscreenElement) {
        btn.classList.add('hidden');
      } else {
        btn.classList.remove('hidden');
      }
    });

    // F11 key handler
    document.addEventListener('keydown', (e) => {
      if (e.key === 'F11') {
        e.preventDefault();
        toggleFullscreen();
      }
    });
  </script>
</body>
</html>
