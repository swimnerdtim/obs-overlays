<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Barbie Scoreboard V2 - Swimnerd Live</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --barbie-pink: #E0218A;
      --barbie-hot-pink: #FF69B4;
      --barbie-light-pink: #FFB6D9;
      --barbie-dark-pink: #C71585;
      --barbie-accent: #FFF0F5;
      --gradient-bg: linear-gradient(135deg, #E0218A 0%, #C71585 100%);
      --text-primary: #FFFFFF;
      --text-green: #00FF00;
      --text-red: #FF1493;
      --text-yellow: #FFD700;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Montserrat', 'Arial', sans-serif;
      background: var(--gradient-bg);
      color: var(--text-primary);
      overflow: hidden;
      width: 1920px;
      height: 1080px;
      display: flex;
      flex-direction: column;
    }

    /* Header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 24px 50px;
      background: rgba(255, 255, 255, 0.15);
      border-bottom: 4px solid var(--barbie-accent);
      flex-shrink: 0;
    }

    .event-name {
      font-size: 62px;
      font-weight: 800;
      text-shadow: 0 3px 10px rgba(0, 0, 0, 0.5);
    }

    /* Main content area - lanes left, times right */
    .main-content {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* Left side - Lane info */
    .lanes-left {
      flex: 1;
      padding: 30px 30px 30px 50px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      justify-content: space-evenly;
    }

    .lane-row {
      display: grid;
      grid-template-columns: 100px 120px 1fr 200px;
      gap: 24px;
      align-items: center;
      background: rgba(255, 255, 255, 0.12);
      padding: 35px 30px;
      border-radius: 10px;
      border-left: 6px solid var(--barbie-accent);
    }

    .lane-row.first-place {
      background: linear-gradient(135deg, rgba(255, 215, 0, 0.3), rgba(255, 165, 0, 0.3));
      border-left-color: #FFD700;
      box-shadow: 0 8px 24px rgba(255, 215, 0, 0.4);
    }

    .lane-number {
      font-size: 72px;
      font-weight: 900;
      color: var(--text-green);
      text-shadow: 0 4px 10px rgba(0, 0, 0, 0.8);
      text-align: center;
    }

    .place {
      font-size: 72px;
      font-weight: 900;
      color: var(--text-red);
      text-shadow: 0 4px 10px rgba(0, 0, 0, 0.8);
      text-align: center;
    }

    .place.empty {
      opacity: 0;
    }

    .swimmer-name {
      font-size: 56px;
      font-weight: 700;
      text-shadow: 0 4px 10px rgba(0, 0, 0, 0.7);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .team {
      font-size: 48px;
      font-weight: 600;
      text-shadow: 0 4px 10px rgba(0, 0, 0, 0.7);
      opacity: 0.95;
    }

    /* Right side - Timer + Times */
    .times-right {
      width: 450px;
      padding: 30px 50px 30px 30px;
      display: flex;
      flex-direction: column;
      gap: 15px;
      background: rgba(0, 0, 0, 0.15);
      border-left: 4px solid var(--barbie-accent);
    }

    .race-clock {
      font-size: 100px;
      font-weight: 900;
      font-variant-numeric: tabular-nums;
      text-shadow: 0 4px 16px rgba(0, 0, 0, 0.7);
      color: var(--barbie-accent);
      text-align: center;
      padding: 20px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      margin-bottom: 10px;
    }

    .time-entry {
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding: 12px 20px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 8px;
    }

    .time-entry.first-place {
      background: linear-gradient(135deg, rgba(255, 215, 0, 0.25), rgba(255, 165, 0, 0.25));
    }

    .split-time {
      font-size: 42px;
      font-weight: 700;
      color: var(--text-yellow);
      text-shadow: 0 3px 8px rgba(0, 0, 0, 0.7);
      font-variant-numeric: tabular-nums;
      text-align: center;
    }

    .final-time {
      font-size: 62px;
      font-weight: 900;
      color: var(--barbie-accent);
      text-shadow: 0 4px 12px rgba(0, 0, 0, 0.8);
      font-variant-numeric: tabular-nums;
      text-align: center;
    }

    .time-entry.first-place .final-time {
      color: #FFD700;
    }

    /* Footer */
    .footer {
      display: flex;
      justify-content: space-between;
      padding: 16px 40px;
      background: rgba(0, 0, 0, 0.4);
      border-top: 2px solid rgba(255, 255, 255, 0.3);
      flex-shrink: 0;
    }

    .footer-item {
      font-size: 36px;
      font-weight: 600;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
    }

    .footer-label {
      color: var(--text-green);
      margin-right: 12px;
      font-weight: 700;
    }

    .footer-value {
      color: var(--text-primary);
      font-weight: 600;
    }
  </style>
</head>
<body>
  <!-- Header -->
  <div class="header">
    <div class="event-name" id="eventName">Event 12 - Girls 200 IM</div>
  </div>

  <!-- Main Content -->
  <div class="main-content">
    <!-- Left: Lanes -->
    <div class="lanes-left" id="lanesLeft">
      <!-- Populated by JS -->
    </div>

    <!-- Right: Timer + Times -->
    <div class="times-right">
      <div class="race-clock" id="raceClock">0:00.00</div>
      <div id="timesContainer">
        <!-- Populated by JS -->
      </div>
    </div>
  </div>

  <!-- Footer -->
  <div class="footer">
    <div class="footer-item">
      <span class="footer-label">EV:</span>
      <span class="footer-value" id="eventNumber">12</span>
    </div>
    <div class="footer-item">
      <span class="footer-label">HT:</span>
      <span class="footer-value" id="heatNumber">3 of 4</span>
    </div>
    <div class="footer-item">
      <span class="footer-label">Lengths:</span>
      <span class="footer-value" id="lengths">4</span>
    </div>
    <div class="footer-item">
      <span class="footer-label">Record:</span>
      <span class="footer-value" id="record">2:03.45</span>
    </div>
  </div>

  <script>
    // Demo data
    const demoLanes = [
      { lane: 1, name: 'Sarah Johnson', team: 'NOVA', split: '1:01.23', time: '2:08.45', place: null },
      { lane: 2, name: 'Emma Williams', team: 'RAYS', split: '59.87', time: '2:05.67', place: 3 },
      { lane: 3, name: 'Katie Martinez', team: 'TIDE', split: '58.34', time: '2:03.12', place: 1 },
      { lane: 4, name: 'Olivia Davis', team: 'WAVE', split: '59.12', time: '2:04.89', place: 2 },
      { lane: 5, name: 'Sophia Brown', team: 'HEAT', split: '1:00.45', time: '2:07.23', place: 4 },
      { lane: 6, name: 'Ava Garcia', team: 'BOLT', split: '1:01.89', time: '2:09.01', place: null },
      { lane: 7, name: 'Isabella Lopez', team: 'FAST', split: '1:02.34', time: '2:10.56', place: null },
      { lane: 8, name: 'Mia Rodriguez', team: 'FIRE', split: '1:00.78', time: '2:07.89', place: 5 },
    ];

    function updateDisplay() {
      const lanesLeft = document.getElementById('lanesLeft');
      const timesContainer = document.getElementById('timesContainer');
      
      lanesLeft.innerHTML = '';
      timesContainer.innerHTML = '';
      
      demoLanes.forEach(lane => {
        // Left side: Lane row
        const laneDiv = document.createElement('div');
        laneDiv.className = 'lane-row';
        if (lane.place === 1) laneDiv.classList.add('first-place');
        
        const placeHTML = lane.place 
          ? `<div class="place">${lane.place}</div>` 
          : `<div class="place empty">-</div>`;
        
        laneDiv.innerHTML = `
          <div class="lane-number">${lane.lane}</div>
          ${placeHTML}
          <div class="swimmer-name">${lane.name}</div>
          <div class="team">${lane.team}</div>
        `;
        lanesLeft.appendChild(laneDiv);
        
        // Right side: Times
        const timeDiv = document.createElement('div');
        timeDiv.className = 'time-entry';
        if (lane.place === 1) timeDiv.classList.add('first-place');
        
        timeDiv.innerHTML = `
          <div class="split-time">${lane.split || ''}</div>
          <div class="final-time">${lane.time || ''}</div>
        `;
        timesContainer.appendChild(timeDiv);
      });
    }

    // Race clock simulation
    let raceStartTime = null;
    let raceRunning = false;

    function startRace() {
      raceStartTime = Date.now();
      raceRunning = true;
      updateRaceClock();
    }

    function updateRaceClock() {
      if (!raceRunning) return;
      
      const elapsed = Date.now() - raceStartTime;
      const minutes = Math.floor(elapsed / 60000);
      const seconds = Math.floor((elapsed % 60000) / 1000);
      const centis = Math.floor((elapsed % 1000) / 10);
      
      document.getElementById('raceClock').textContent = 
        `${minutes}:${seconds.toString().padStart(2, '0')}.${centis.toString().padStart(2, '0')}`;
      
      requestAnimationFrame(updateRaceClock);
    }

    // Initialize
    updateDisplay();
    setTimeout(startRace, 2000);
  </script>
</body>
</html>
