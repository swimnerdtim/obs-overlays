<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Barbie Scoreboard - 2025 Worlds</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 1600px;
      margin: 0 auto;
    }

    h1 {
      color: white;
      text-align: center;
      margin-bottom: 30px;
      font-size: 36px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.3);
    }

    .info-box {
      background: #fff3cd;
      border-left: 4px solid #ffc107;
      padding: 16px;
      border-radius: 8px;
      margin-bottom: 20px;
    }

    .info-box p {
      margin: 0;
      color: #856404;
      line-height: 1.6;
    }

    .controls {
      background: white;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.2);
      margin-bottom: 30px;
    }

    .control-section {
      margin-bottom: 24px;
      padding-bottom: 24px;
      border-bottom: 2px solid #f0f0f0;
    }

    .control-section:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    .control-section h2 {
      color: #E0218A;
      margin-bottom: 16px;
      font-size: 20px;
    }

    .control-group {
      margin-bottom: 16px;
    }

    .control-group label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
      color: #333;
      font-size: 14px;
    }

    .control-group select {
      width: 100%;
      padding: 10px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 14px;
      transition: border-color 0.3s;
    }

    .control-group select:focus {
      outline: none;
      border-color: #E0218A;
    }

    .button-group {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    button {
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
    }

    .btn-primary {
      background: linear-gradient(135deg, #E0218A, #FF69B4);
      color: white;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(224, 33, 138, 0.4);
    }

    .btn-secondary {
      background: #f5f5f5;
      color: #333;
    }

    .btn-secondary:hover {
      background: #e0e0e0;
    }

    .btn-success {
      background: #28a745;
      color: white;
    }

    .btn-success:hover {
      background: #218838;
    }

    .btn-danger {
      background: #dc3545;
      color: white;
    }

    .btn-danger:hover {
      background: #c82333;
    }

    .preview-container {
      background: white;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 8px 32px rgba(0,0,0,0.2);
    }

    .preview-header {
      background: linear-gradient(135deg, #E0218A, #FF69B4);
      padding: 16px 24px;
      color: white;
      font-weight: 700;
      font-size: 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .preview-frame {
      position: relative;
      background: #1a1a1a;
      aspect-ratio: 16/9;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    .fullscreen-btn {
      background: rgba(255,255,255,0.2);
      border: 1px solid rgba(255,255,255,0.3);
      color: white;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
    }

    .fullscreen-btn:hover {
      background: rgba(255,255,255,0.3);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>💖 Barbie Scoreboard - 2025 World Championships 💖</h1>

    <div class="info-box">
      <p><strong>✨ Real championship data from 2025 World Championships Singapore!</strong> Select an event and click Start Race to see the race unfold with actual splits and times.</p>
    </div>

    <div class="controls">
      <!-- Event Selection -->
      <div class="control-section">
        <h2>🏆 Select Championship Event</h2>
        <div class="control-group">
          <label>Event</label>
          <select id="eventSelect" onchange="selectEvent()">
            <optgroup label="Women's Events">
              <option value="400m Free-Women" selected>Women's 400m Free</option>
              <option value="100m Fly-Women">Women's 100m Fly</option>
              <option value="200m IM-Women">Women's 200m IM</option>
              <option value="1500m Free-Women">Women's 1500m Free</option>
              <option value="200m Breast-Women">Women's 200m Breast</option>
              <option value="200m Free-Women">Women's 200m Free</option>
              <option value="100m Free-Women">Women's 100m Free</option>
              <option value="50m Fly-Women">Women's 50m Fly</option>
              <option value="800m Free-Women">Women's 800m Free</option>
              <option value="100m Back-Women">Women's 100m Back</option>
              <option value="400m IM-Women">Women's 400m IM</option>
              <option value="50m Back-Women">Women's 50m Back</option>
              <option value="200m Back-Women">Women's 200m Back</option>
              <option value="100m Breast-Women">Women's 100m Breast</option>
              <option value="200m Fly-Women">Women's 200m Fly</option>
              <option value="50m Free-Women">Women's 50m Free</option>
              <option value="50m Breast-Women">Women's 50m Breast</option>
            </optgroup>
            <optgroup label="Men's Events">
              <option value="400m Free-Men">Men's 400m Free</option>
              <option value="100m Breast-Men">Men's 100m Breast</option>
              <option value="50m Fly-Men">Men's 50m Fly</option>
              <option value="200m Free-Men">Men's 200m Free</option>
              <option value="800m Free-Men">Men's 800m Free</option>
              <option value="100m Fly-Men">Men's 100m Fly</option>
              <option value="50m Back-Men">Men's 50m Back</option>
              <option value="200m IM-Men">Men's 200m IM</option>
              <option value="200m Breast-Men">Men's 200m Breast</option>
              <option value="1500m Free-Men">Men's 1500m Free</option>
              <option value="200m Fly-Men">Men's 200m Fly</option>
              <option value="100m Free-Men">Men's 100m Free</option>
              <option value="200m Back-Men">Men's 200m Back</option>
              <option value="100m Back-Men">Men's 100m Back</option>
              <option value="50m Free-Men">Men's 50m Free</option>
              <option value="50m Breast-Men">Men's 50m Breast</option>
              <option value="400m IM-Men">Men's 400m IM</option>
            </optgroup>
          </select>
        </div>
      </div>

      <!-- Race Controls -->
      <div class="control-section">
        <h2>🏊 Race Controls</h2>
        <div class="button-group">
          <button class="btn-success" onclick="startRace()">▶ Start Race</button>
          <button class="btn-danger" onclick="stopRace()">⏹ Stop Race</button>
          <button class="btn-primary" onclick="simulateFinish()">🏁 Show Final Results</button>
          <button class="btn-secondary" onclick="clearLanes()">Clear Lanes</button>
        </div>
      </div>
    </div>

    <!-- Preview -->
    <div class="preview-container">
      <div class="preview-header">
        <span>📺 Full-Screen Barbie Scoreboard</span>
        <button class="fullscreen-btn" onclick="openFullscreen()">Open Fullscreen</button>
      </div>
      <div class="preview-frame">
        <iframe id="scoreboardFrame" src="scoreboard.html"></iframe>
      </div>
    </div>
  </div>

  <script>
    const channel = new BroadcastChannel('swimnerd-live');
    let currentEvent = null;
    let worldsData = [];

    // Load worlds data from external file
    fetch('worlds_2025_simulator_data.json')
      .then(r => r.json())
      .then(data => {
        worldsData = data;
        console.log('Loaded', worldsData.length, 'championship events');
        // Clear any old data on load
        clearLanes();
        // Auto-select Women's 400 Free and load event info
        selectEvent();
      })
      .catch(err => {
        console.error('Failed to load worlds data:', err);
        alert('Failed to load championship data. Please refresh the page.');
      });

    function selectEvent() {
      if (worldsData.length === 0) {
        console.log('Data not loaded yet...');
        return;
      }

      const selected = document.getElementById('eventSelect').value;
      const [eventName, gender] = selected.split('-');
      
      currentEvent = worldsData.find(e => e.event === eventName && e.gender === gender);
      
      if (currentEvent) {
        // Update event info
        const eventNumber = worldsData.indexOf(currentEvent) + 1;
        const lengths = Math.ceil(parseInt(currentEvent.event.match(/\d+/)[0]) / 50);
        
        const data = {
          type: 'event_update',
          eventNumber: eventNumber,
          eventName: `${gender === 'Men' ? "Men's" : "Women's"} ${eventName} - 2025 Worlds`,
          heatNumber: 'Finals',
          totalHeats: 1,
          lengths: lengths,
          record: formatTime(Math.min(...currentEvent.finalists.map(f => f.time)))
        };
        channel.postMessage(data);
        
        // Clear lanes when switching events
        clearLanes();
      }
    }

    function startRace() {
      if (!currentEvent) {
        alert('Data is still loading... please wait a moment and try again.');
        return;
      }
      
      // Generate lanes from championship data
      const lanes = [];
      for (let i = 0; i < Math.min(8, currentEvent.finalists.length); i++) {
        const finalist = currentEvent.finalists[i];
        
        lanes.push({
          lane: i + 1,
          name: finalist.athlete,
          team: finalist.nation,
          split: '',
          time: '',
          place: null
        });
      }
      
      channel.postMessage({ type: 'race_update', lanes });
      channel.postMessage({ type: 'race_start' });
    }

    function stopRace() {
      channel.postMessage({ type: 'race_finish', lanes: [] });
    }

    function simulateFinish() {
      if (!currentEvent) {
        alert('Data is still loading... please wait a moment and try again.');
        return;
      }
      
      const lanes = [];
      for (let i = 0; i < Math.min(8, currentEvent.finalists.length); i++) {
        const finalist = currentEvent.finalists[i];
        const midpoint = finalist.splits[Math.floor(finalist.splits.length / 2)];
        
        lanes.push({
          lane: i + 1,
          name: finalist.athlete,
          team: finalist.nation,
          split: formatTime(midpoint.cumulative_time),
          time: formatTime(finalist.time),
          place: i + 1
        });
      }
      
      channel.postMessage({ type: 'race_finish', lanes });
    }

    function clearLanes() {
      channel.postMessage({ type: 'race_update', lanes: [] });
    }

    function formatTime(seconds) {
      const mins = Math.floor(seconds / 60);
      const secs = (seconds % 60).toFixed(2);
      return mins > 0 ? `${mins}:${secs.padStart(5, '0')}` : secs;
    }

    function openFullscreen() {
      window.open('scoreboard.html', '_blank');
    }
  </script>
</body>
</html>
