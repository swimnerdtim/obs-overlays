<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Barbie Scoreboard - 2025 World Championships Simulator</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --barbie-pink: #E0218A;
      --barbie-hot-pink: #FF69B4;
      --barbie-light-pink: #FFB6D9;
      --barbie-dark-pink: #C71585;
      --barbie-accent: #FFF0F5;
      --gradient-bg: linear-gradient(135deg, #E0218A 0%, #C71585 100%);
      --text-primary: #FFFFFF;
      --text-green: #00FF00;
      --text-red: #FF1493;
      --text-yellow: #FFD700;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    body {
      font-family: 'Montserrat', 'Arial', sans-serif;
      background: var(--gradient-bg);
      color: var(--text-primary);
      display: flex;
      flex-direction: column;
    }

    /* Barbie Car */
    .barbie-car {
      position: fixed;
      bottom: 80px;
      width: 150px;
      height: auto;
      z-index: 999;
      animation: drive 8s linear infinite;
      filter: drop-shadow(0 4px 8px rgba(0,0,0,0.3));
    }
    @keyframes drive { 0% { left: -200px; } 100% { left: 100vw; } }

    /* Header - Event + Clock */
    .header {
      display: grid;
      grid-template-columns: 1fr 480px;
      align-items: center;
      padding: 24px 50px;
      background: rgba(255, 255, 255, 0.15);
      border-bottom: 4px solid var(--barbie-accent);
      flex-shrink: 0;
    }

    .event-name {
      font-size: 62px;
      font-weight: 800;
      text-shadow: 0 3px 10px rgba(0, 0, 0, 0.5);
    }

    .race-clock {
      font-size: 120px;
      font-weight: 900;
      font-variant-numeric: tabular-nums;
      text-shadow: 0 4px 16px rgba(0, 0, 0, 0.7);
      color: var(--barbie-accent);
      text-align: right;
    }

    /* Lanes Container */
    .lanes-container {
      padding: 30px 50px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      flex: 1 1 auto;
      min-height: 0;
      overflow: auto;
    }

    /* Individual Lane */
    .lane {
      display: grid;
      grid-template-columns: 80px 1fr 200px 220px;
      align-items: center;
      gap: 30px;
      background: rgba(255, 255, 255, 0.25);
      border-radius: 16px;
      border-left: 8px solid var(--text-green);
      padding: 20px 40px 20px 30px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
      min-height: 90px;
    }

    .lane.first-place {
      background: linear-gradient(135deg, rgba(255, 215, 0, 0.3), rgba(255, 165, 0, 0.3));
      border-left-color: #FFD700;
      box-shadow: 0 8px 24px rgba(255, 215, 0, 0.4);
    }

    .lane-indicator {
      font-size: 68px;
      font-weight: 900;
      color: var(--text-green);
      text-shadow: 0 3px 8px rgba(0, 0, 0, 0.7);
      text-align: center;
    }

    .lane.first-place .lane-indicator {
      color: #FFD700;
    }

    .swimmer-info {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .swimmer-name {
      font-size: 48px;
      font-weight: 800;
      line-height: 1.1;
      text-shadow: 0 3px 8px rgba(0, 0, 0, 0.7);
    }

    .swimmer-nation {
      font-size: 36px;
      font-weight: 700;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.6);
      opacity: 0.95;
    }

    .split-time {
      font-size: 54px;
      font-weight: 800;
      color: var(--text-yellow);
      text-shadow: 0 4px 10px rgba(0, 0, 0, 0.8);
      font-variant-numeric: tabular-nums;
      text-align: right;
    }

    .final-time {
      font-size: 68px;
      font-weight: 900;
      color: var(--barbie-accent);
      text-shadow: 0 5px 15px rgba(0, 0, 0, 0.9);
      font-variant-numeric: tabular-nums;
      text-align: right;
    }

    .lane.first-place .final-time {
      color: #FFD700;
      font-size: 80px;
      animation: sparkle 2s ease-in-out infinite;
    }
    
    @keyframes sparkle {
      0%, 100% {
        text-shadow: 
          0 0 20px #FFD700,
          0 0 40px #FFD700,
          0 5px 15px rgba(0, 0, 0, 0.9);
      }
      50% {
        text-shadow: 
          0 0 30px #FFD700,
          0 0 60px #FF69B4,
          0 0 80px #FFD700,
          0 5px 15px rgba(0, 0, 0, 0.9);
      }
    }

    /* Footer Info Bar */
    .footer {
      display: flex;
      justify-content: space-between;
      padding: 16px 40px;
      background: rgba(0, 0, 0, 0.4);
      border-top: 2px solid rgba(255, 255, 255, 0.3);
      flex-shrink: 0;
    }

    .footer-item {
      font-size: 36px;
      font-weight: 600;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
    }

    .footer-label {
      color: var(--text-green);
      margin-right: 12px;
      font-weight: 700;
    }

    .footer-value {
      color: var(--text-primary);
      font-weight: 600;
    }

    /* Controls Overlay */
    .controls-overlay {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(0, 0, 0, 0.95);
      padding: 16px 20px;
      display: flex;
      gap: 12px;
      align-items: center;
      justify-content: center;
      border-top: 3px solid var(--barbie-pink);
      z-index: 1000;
      flex-wrap: wrap;
    }

    .controls-overlay select {
      padding: 10px 16px;
      font-size: 15px;
      border-radius: 8px;
      border: 2px solid var(--barbie-pink);
      background: white;
      font-family: 'Montserrat', sans-serif;
      font-weight: 600;
      min-width: 280px;
    }

    .controls-overlay button {
      padding: 10px 24px;
      font-size: 16px;
      font-weight: 700;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.3s;
      font-family: 'Montserrat', sans-serif;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
    }

    .btn-start {
      background: linear-gradient(135deg, #00FF00 0%, #00CC00 100%);
      color: white;
      box-shadow: 0 4px 12px rgba(0, 255, 0, 0.4);
    }

    .btn-start:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(0, 255, 0, 0.6);
    }

    .btn-reset {
      background: linear-gradient(135deg, #FF6B6B 0%, #FF4444 100%);
      color: white;
      box-shadow: 0 4px 12px rgba(255, 68, 68, 0.4);
    }

    .btn-nav {
      background: linear-gradient(135deg, var(--barbie-pink) 0%, var(--barbie-dark-pink) 100%);
      color: white;
      box-shadow: 0 4px 12px rgba(224, 33, 138, 0.4);
    }

    .btn-nav:hover, .btn-reset:hover {
      transform: translateY(-2px);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none !important;
    }
  </style>
</head>
<body>
  <img src="https://i.imgur.com/8h4K3Yq.png" alt="Barbie Car" class="barbie-car" onerror="this.style.display='none'">

  <!-- Header -->
  <div class="header">
    <div class="event-name" id="eventName">Loading...</div>
    <div class="race-clock" id="raceClock">0:00.00</div>
  </div>

  <!-- Lanes -->
  <div class="lanes-container" id="lanesContainer">
    <div style="text-align: center; padding: 40px; font-size: 24px;">
      Loading 2025 World Championships...
    </div>
  </div>

  <!-- Footer Info -->
  <div class="footer">
    <div class="footer-item">
      <span class="footer-label">EV:</span>
      <span class="footer-value" id="eventNum">1</span>
    </div>
    <div class="footer-item">
      <span class="footer-label">HT:</span>
      <span class="footer-value">Finals</span>
    </div>
    <div class="footer-item">
      <span class="footer-label">Course:</span>
      <span class="footer-value">LCM</span>
    </div>
    <div class="footer-item">
      <span class="footer-label">Singapore:</span>
      <span class="footer-value">2025</span>
    </div>
  </div>

  <!-- Controls -->
  <div class="controls-overlay">
    <button class="btn-nav" onclick="previousEvent()">◀ Prev</button>
    <select id="eventSelector" onchange="selectEvent()">
      <option>Loading events...</option>
    </select>
    <button class="btn-nav" onclick="nextEvent()">Next ▶</button>
    <button class="btn-start" id="startBtn" onclick="startRace()">▶ Start Race</button>
    <button class="btn-reset" onclick="resetRace()">🔄 Reset</button>
  </div>

  <script>
    let eventsData = [];
    let currentEventIndex = 0;
    let raceInProgress = false;
    let raceInterval;

    // Fetch 2025 Worlds data
    fetch('https://raw.githubusercontent.com/swimnerdtim/obs-overlays/main/worlds_2025_simulator_data.json')
      .then(response => response.json())
      .then(data => {
        eventsData = data;
        populateEventSelector();
        loadEvent(0);
      })
      .catch(error => {
        console.error('Error:', error);
        document.getElementById('eventName').textContent = 'Error loading data';
      });

    function populateEventSelector() {
      const select = document.getElementById('eventSelector');
      select.innerHTML = '';
      eventsData.forEach((event, index) => {
        const option = document.createElement('option');
        option.value = index;
        option.textContent = `${index + 1}. ${event.event} ${event.gender}`;
        select.appendChild(option);
      });
    }

    function selectEvent() {
      const index = parseInt(document.getElementById('eventSelector').value);
      loadEvent(index);
    }

    function loadEvent(index) {
      if (index < 0 || index >= eventsData.length) return;
      
      currentEventIndex = index;
      const event = eventsData[index];
      
      document.getElementById('eventSelector').value = index;
      document.getElementById('eventName').textContent = `${event.event} ${event.gender}`;
      document.getElementById('eventNum').textContent = index + 1;
      
      resetRace();
    }

    function initializeLanes() {
      const event = eventsData[currentEventIndex];
      const container = document.getElementById('lanesContainer');
      container.innerHTML = '';

      // Sort by time
      const sorted = [...event.finalists].sort((a, b) => a.time - b.time);

      sorted.forEach((swimmer, index) => {
        const lane = document.createElement('div');
        lane.className = 'lane';
        lane.id = `swimmer-${index}`;
        
        if (index === 0) {
          lane.classList.add('first-place');
        }

        lane.innerHTML = `
          <div class="lane-indicator">${index + 1}</div>
          <div class="swimmer-info">
            <div class="swimmer-name">${swimmer.athlete}</div>
            <div class="swimmer-nation">${swimmer.nation}</div>
          </div>
          <div class="split-time" id="split-${index}"></div>
          <div class="final-time" id="time-${index}"></div>
        `;

        container.appendChild(lane);
      });
    }

    function formatTime(seconds) {
      if (seconds >= 60) {
        const mins = Math.floor(seconds / 60);
        const secs = (seconds % 60).toFixed(2).padStart(5, '0');
        return `${mins}:${secs}`;
      }
      return seconds.toFixed(2);
    }

    function startRace() {
      if (raceInProgress) return;
      raceInProgress = true;
      document.getElementById('startBtn').disabled = true;

      const event = eventsData[currentEventIndex];
      const sorted = [...event.finalists].sort((a, b) => a.time - b.time);
      const clockEl = document.getElementById('raceClock');
      
      let currentTime = 0;
      const fastestTime = sorted[0].time;
      
      // Find halfway split
      const splitDistance = sorted[0].splits[Math.floor(sorted[0].splits.length / 2)]?.distance || 50;

      raceInterval = setInterval(() => {
        currentTime += 0.01;
        clockEl.textContent = formatTime(currentTime);

        // Show splits at halfway
        sorted.forEach((swimmer, idx) => {
          const splitTime = swimmer.splits.find(s => s.distance === splitDistance)?.cumulative_time || 0;
          if (currentTime >= splitTime && splitTime > 0) {
            const splitEl = document.getElementById(`split-${idx}`);
            if (splitEl && !splitEl.textContent) {
              splitEl.textContent = formatTime(splitTime);
            }
          }

          // Show final times
          if (currentTime >= swimmer.time) {
            const timeEl = document.getElementById(`time-${idx}`);
            if (timeEl) {
              timeEl.textContent = formatTime(swimmer.time);
            }
          }
        });

        if (currentTime >= fastestTime + 0.5) {
          clearInterval(raceInterval);
          raceInProgress = false;
          document.getElementById('startBtn').disabled = false;
        }
      }, 10);
    }

    function resetRace() {
      if (raceInterval) clearInterval(raceInterval);
      raceInProgress = false;
      document.getElementById('startBtn').disabled = false;
      document.getElementById('raceClock').textContent = '0:00.00';
      initializeLanes();
    }

    function previousEvent() {
      if (currentEventIndex > 0) {
        loadEvent(currentEventIndex - 1);
      }
    }

    function nextEvent() {
      if (currentEventIndex < eventsData.length - 1) {
        loadEvent(currentEventIndex + 1);
      }
    }
  </script>
</body>
</html>
