<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>TMNT Lane Overlay Demo</title>
  <link href="tmnt-theme.css" rel="stylesheet">
  <style>
    body {
      width: 1920px;
      height: 1080px;
      margin: 0;
      padding: 0;
    }

    .lanes-container {
      position: absolute;
      right: 0;
      top: 200px;
      width: 800px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 20px;
    }

    .lane-content {
      display: grid;
      grid-template-columns: 80px 80px 280px 160px 200px;
      gap: 12px;
      align-items: center;
      padding: 16px 20px;
    }

    .lane-indicator {
      font-size: 48px;
      font-weight: 900;
      text-align: center;
      padding: 8px;
    }

    .place-indicator {
      font-size: 48px;
      font-weight: 900;
      text-align: center;
    }

    .swimmer-name {
      font-size: 32px;
      font-weight: 700;
    }

    .split-time {
      font-size: 36px;
      font-weight: 700;
      text-align: right;
    }

    .final-time {
      font-size: 42px;
      font-weight: 900;
      text-align: right;
    }
  </style>
</head>
<body>
  <div class="lanes-container">
    <div class="lane-content visible">
      <div class="lane-indicator">1</div>
      <div class="place-indicator"></div>
      <div class="swimmer-name">KATIE LEDECKY</div>
      <div class="split-time">28.45</div>
      <div class="final-time">1:52.34</div>
    </div>

    <div class="lane-content visible">
      <div class="lane-indicator">2</div>
      <div class="place-indicator">3</div>
      <div class="swimmer-name">SIMONE MANUEL</div>
      <div class="split-time">28.92</div>
      <div class="final-time">1:53.12</div>
    </div>

    <div class="lane-content visible first-place">
      <div class="lane-indicator">3</div>
      <div class="place-indicator">1</div>
      <div class="swimmer-name">MISSY FRANKLIN</div>
      <div class="split-time">28.15</div>
      <div class="final-time">1:51.78</div>
    </div>

    <div class="lane-content visible">
      <div class="lane-indicator">4</div>
      <div class="place-indicator">2</div>
      <div class="swimmer-name">KATIE GRIMES</div>
      <div class="split-time">28.67</div>
      <div class="final-time">1:52.89</div>
    </div>

    <div class="lane-content visible">
      <div class="lane-indicator">5</div>
      <div class="place-indicator">4</div>
      <div class="swimmer-name">EMMA WEYANT</div>
      <div class="split-time">29.01</div>
      <div class="final-time">1:54.23</div>
    </div>

    <div class="lane-content visible">
      <div class="lane-indicator">6</div>
      <div class="place-indicator"></div>
      <div class="swimmer-name">ALEX WALSH</div>
      <div class="split-time">29.34</div>
      <div class="final-time">1:55.12</div>
    </div>

    <div class="lane-content visible">
      <div class="lane-indicator">7</div>
      <div class="place-indicator"></div>
      <div class="swimmer-name">KATE DOUGLASS</div>
      <div class="split-time">29.56</div>
      <div class="final-time">1:55.89</div>
    </div>

    <div class="lane-content visible">
      <div class="lane-indicator">8</div>
      <div class="place-indicator">5</div>
      <div class="swimmer-name">BELLA SIMS</div>
      <div class="split-time">29.12</div>
      <div class="final-time">1:54.67</div>
    </div>
  </div>

  <script>
    // Stagger lane visibility
    const lanes = document.querySelectorAll('.lane-content');
    lanes.forEach((lane, i) => {
      lane.style.animationDelay = `${i * 0.08}s`;
    });
  </script>
</body>
</html>
