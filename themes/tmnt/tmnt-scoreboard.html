<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>TMNT Scoreboard - Turtle Power!</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Impact', 'Arial Black', sans-serif;
      background: linear-gradient(180deg, #1a1a1a 0%, #0a3d0a 50%, #000000 100%);
      color: #FFFFFF;
      overflow: hidden;
      width: 1920px;
      height: 1080px;
      position: relative;
    }

    /* Sewer brick texture overlay */
    body::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: 
        repeating-linear-gradient(
          90deg,
          transparent,
          transparent 80px,
          rgba(0, 0, 0, 0.1) 80px,
          rgba(0, 0, 0, 0.1) 82px
        ),
        repeating-linear-gradient(
          0deg,
          transparent,
          transparent 40px,
          rgba(0, 0, 0, 0.1) 40px,
          rgba(0, 0, 0, 0.1) 42px
        );
      pointer-events: none;
      z-index: 1;
    }

    /* Header - Pizza box style */
    .header {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 50px;
      background: linear-gradient(135deg, #FF6B35 0%, #D94A1E 100%);
      border-bottom: 8px solid #8B2500;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.6);
      z-index: 100;
      animation: pizzaBoxDrop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    @keyframes pizzaBoxDrop {
      0% { transform: translateY(-100%); opacity: 0; }
      60% { transform: translateY(10px); }
      100% { transform: translateY(0); opacity: 1; }
    }

    .event-name {
      font-size: 48px;
      font-weight: 900;
      color: #FFEB3B;
      text-shadow: 3px 3px 0px #000000, 
                   -1px -1px 0px #000000,
                   1px -1px 0px #000000,
                   -1px 1px 0px #000000;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .race-clock {
      font-size: 80px;
      font-weight: 900;
      font-variant-numeric: tabular-nums;
      color: #4CAF50;
      text-shadow: 4px 4px 0px #000000,
                   -2px -2px 0px #000000,
                   2px -2px 0px #000000,
                   -2px 2px 0px #000000;
    }

    /* Lane Results */
    .lanes-container {
      position: absolute;
      top: 110px;
      left: 0;
      right: 0;
      bottom: 50px;
      padding: 10px 50px;
      display: flex;
      flex-direction: column;
      gap: 3px;
      overflow: hidden;
      z-index: 10;
    }

    .lane {
      display: grid;
      grid-template-columns: 80px 100px 360px 280px 220px 1fr;
      gap: 20px;
      align-items: center;
      background: linear-gradient(135deg, rgba(76, 175, 80, 0.9) 0%, rgba(56, 142, 60, 0.9) 100%);
      padding: 8px 100px 8px 35px;
      border-radius: 8px;
      border: 4px solid #2E7D32;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5),
                  inset 0 2px 0px rgba(255, 255, 255, 0.2);
      transition: all 0.3s ease;
      opacity: 1;
      transform: translateX(0);
    }

    .lane.visible {
      animation: sewerSlideIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    @keyframes sewerSlideIn {
      0% { transform: translateX(-100%); opacity: 0; }
      60% { transform: translateX(5%); }
      100% { transform: translateX(0); opacity: 1; }
    }

    /* Turtle color rotation per lane */
    .lane:nth-child(1) { border-color: #2196F3; } /* Leonardo blue */
    .lane:nth-child(2) { border-color: #F44336; } /* Raphael red */
    .lane:nth-child(3) { border-color: #9C27B0; } /* Donatello purple */
    .lane:nth-child(4) { border-color: #FF9800; } /* Michelangelo orange */
    .lane:nth-child(5) { border-color: #2196F3; }
    .lane:nth-child(6) { border-color: #F44336; }
    .lane:nth-child(7) { border-color: #9C27B0; }
    .lane:nth-child(8) { border-color: #FF9800; }

    .lane-number {
      font-size: 60px;
      font-weight: 900;
      color: #FFEB3B;
      text-shadow: 3px 3px 0px #000000,
                   -1px -1px 0px #000000,
                   1px -1px 0px #000000,
                   -1px 1px 0px #000000;
      text-align: center;
    }

    .place {
      font-size: 60px;
      font-weight: 900;
      color: #FF5722;
      text-shadow: 3px 3px 0px #000000,
                   -1px -1px 0px #000000,
                   1px -1px 0px #000000,
                   -1px 1px 0px #000000;
      text-align: center;
      animation: pizzaBounce 0.6s ease-out;
    }

    .place.empty {
      opacity: 0;
    }

    @keyframes pizzaBounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-15px); }
    }

    .swimmer-name {
      font-size: 42px;
      font-weight: 900;
      color: #FFFFFF;
      text-shadow: 2px 2px 0px #000000,
                   -1px -1px 0px #000000;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-transform: uppercase;
    }

    .team {
      font-size: 38px;
      font-weight: 700;
      color: #FFEB3B;
      text-shadow: 2px 2px 0px #000000;
      text-transform: uppercase;
    }

    .split-time {
      font-size: 46px;
      font-weight: 900;
      color: #00E676;
      text-shadow: 2px 2px 0px #000000;
      font-variant-numeric: tabular-nums;
      text-align: right;
    }

    .final-time {
      font-size: 56px;
      font-weight: 900;
      color: #FFFFFF;
      text-shadow: 3px 3px 0px #000000,
                   -1px -1px 0px #000000,
                   1px -1px 0px #000000,
                   -1px 1px 0px #000000;
      font-variant-numeric: tabular-nums;
      text-align: right;
    }

    .lane.first-place {
      background: linear-gradient(135deg, rgba(255, 235, 59, 0.95) 0%, rgba(255, 193, 7, 0.95) 100%);
      border-color: #FFC107;
      border-width: 6px;
      animation: turtlePower 0.4s ease-in-out infinite alternate;
      transform: scale(1.02);
    }

    @keyframes turtlePower {
      0% {
        box-shadow: 0 6px 20px rgba(255, 193, 7, 0.6),
                    inset 0 2px 0px rgba(255, 255, 255, 0.4),
                    0 0 30px rgba(255, 235, 59, 0.8);
        filter: brightness(1);
      }
      100% {
        box-shadow: 0 6px 20px rgba(255, 193, 7, 0.8),
                    inset 0 2px 0px rgba(255, 255, 255, 0.6),
                    0 0 50px rgba(255, 255, 255, 1),
                    0 0 80px rgba(255, 193, 7, 0.9);
        filter: brightness(1.2);
      }
    }

    .lane.first-place .final-time {
      color: #FF5722;
      font-size: 64px;
      animation: pizzaBounce 0.6s ease-out infinite;
    }

    /* Footer - Sewer grate style */
    .footer {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      display: flex;
      justify-content: space-between;
      padding: 8px 50px;
      background: linear-gradient(180deg, #1a1a1a 0%, #0a0a0a 100%);
      border-top: 4px solid #4CAF50;
      box-shadow: 0 -4px 10px rgba(0, 0, 0, 0.5);
      z-index: 100;
    }

    .footer-item {
      font-size: 24px;
      font-weight: 700;
      color: #4CAF50;
      text-shadow: 1px 1px 2px #000000;
      text-transform: uppercase;
    }

    .footer-label {
      color: #FFEB3B;
      margin-right: 10px;
      font-weight: 900;
    }

    .footer-value {
      color: #FFFFFF;
      font-weight: 700;
    }

    /* Pizza slice decoration */
    .pizza-slice {
      position: absolute;
      font-size: 60px;
      opacity: 0.3;
      animation: float 6s ease-in-out infinite;
      pointer-events: none;
      z-index: 5;
    }

    .pizza-slice:nth-child(1) { top: 150px; left: 10px; animation-delay: 0s; }
    .pizza-slice:nth-child(2) { top: 400px; right: 20px; animation-delay: 2s; }
    .pizza-slice:nth-child(3) { bottom: 150px; left: 30px; animation-delay: 4s; }

    @keyframes float {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      25% { transform: translateY(-10px) rotate(5deg); }
      50% { transform: translateY(-20px) rotate(10deg); }
      75% { transform: translateY(-10px) rotate(15deg); }
    }

    /* Fullscreen Button */
    .fullscreen-btn {
      position: fixed;
      top: 10px;
      right: 10px;
      background: #4CAF50;
      color: #FFFFFF;
      border: 3px solid #2E7D32;
      padding: 10px 20px;
      font-size: 16px;
      font-weight: 900;
      font-family: 'Impact', sans-serif;
      border-radius: 8px;
      cursor: pointer;
      z-index: 10000;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
      transition: all 0.3s ease;
      text-transform: uppercase;
    }

    .fullscreen-btn:hover {
      background: #66BB6A;
      transform: scale(1.05);
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.6);
    }

    .fullscreen-btn.hidden {
      display: none;
    }

    /* TMNT logo text */
    .tmnt-logo {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 200px;
      font-weight: 900;
      color: rgba(76, 175, 80, 0.1);
      text-shadow: 5px 5px 0px rgba(0, 0, 0, 0.1);
      pointer-events: none;
      z-index: 2;
      letter-spacing: 10px;
    }

    /* Turtle chase sequence */
    .chase-container {
      position: absolute;
      top: 35px;
      left: -200px;
      width: 100%;
      height: 80px;
      pointer-events: none;
      z-index: 150;
      opacity: 0;
    }

    .chase-container.running {
      animation: chaseRun 8s linear forwards;
    }

    @keyframes chaseRun {
      0% {
        left: -400px;
        opacity: 1;
      }
      100% {
        left: calc(100% + 200px);
        opacity: 1;
      }
    }

    .turtle {
      position: absolute;
      width: 80px;
      height: 80px;
      animation: turtleLegs 0.2s steps(2) infinite;
      image-rendering: pixelated;
      filter: drop-shadow(2px 2px 4px rgba(0, 0, 0, 0.5));
      background-color: transparent !important;
    }

    /* Leonardo - Blue */
    .turtle:nth-child(1) { 
      left: 0px;
      background: url('leonardo-orange.png?v=2') no-repeat center !important;
      background-size: contain !important;
      filter: drop-shadow(0 0 10px #2196F3) drop-shadow(2px 2px 4px rgba(0, 0, 0, 0.5));
    }
    
    /* Raphael - Red */
    .turtle:nth-child(2) { 
      left: 100px;
      background: url('raphael-orange.png?v=2') no-repeat center !important;
      background-size: contain !important;
      filter: drop-shadow(0 0 10px #F44336) drop-shadow(2px 2px 4px rgba(0, 0, 0, 0.5));
    }
    
    /* Donatello - Purple */
    .turtle:nth-child(3) { 
      left: 200px;
      background: url('donatello-orange.png?v=2') no-repeat center !important;
      background-size: contain !important;
      filter: drop-shadow(0 0 10px #9C27B0) drop-shadow(2px 2px 4px rgba(0, 0, 0, 0.5));
    }
    
    /* Michelangelo - Orange */
    .turtle:nth-child(4) { 
      left: 300px;
      background: url('michelangelo-orange.png?v=2') no-repeat center !important;
      background-size: contain !important;
      filter: drop-shadow(0 0 10px #FF9800) drop-shadow(2px 2px 4px rgba(0, 0, 0, 0.5));
    }

    @keyframes turtleLegs {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-5px); }
    }

    .villain {
      position: absolute;
      width: 85px;
      height: 85px;
      animation: villainChase 0.3s ease-in-out infinite alternate;
      image-rendering: pixelated;
      filter: drop-shadow(3px 3px 6px rgba(0, 0, 0, 0.6));
      background-color: transparent !important;
    }

    .villain:nth-child(5) { 
      left: 420px;
      background: url('shredder-orange.png?v=2') no-repeat center !important;
      background-size: contain !important;
      filter: drop-shadow(0 0 12px #8B2500) drop-shadow(3px 3px 6px rgba(0, 0, 0, 0.6));
    }
    
    .villain:nth-child(6) { 
      left: 530px;
      background: url('krang-orange.png?v=2') no-repeat center !important;
      background-size: contain !important;
      filter: drop-shadow(0 0 12px #FF00FF) drop-shadow(3px 3px 6px rgba(0, 0, 0, 0.6));
    }

    @keyframes villainChase {
      0% { transform: translateY(0px) scale(1); }
      100% { transform: translateY(-8px) scale(1.05); }
    }

    /* Manhole cover entrance */
    .manhole {
      position: absolute;
      left: 0;
      top: 25px;
      width: 80px;
      height: 80px;
      background: radial-gradient(circle, #404040 0%, #1a1a1a 70%, #000000 100%);
      border-radius: 50%;
      border: 5px solid #808080;
      box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.8),
                  0 4px 10px rgba(0, 0, 0, 0.6);
      z-index: 140;
      opacity: 0;
    }

    .manhole.visible {
      animation: manholeAppear 0.5s ease-out forwards;
    }

    @keyframes manholeAppear {
      0% { opacity: 0; transform: scale(0) rotate(-90deg); }
      100% { opacity: 1; transform: scale(1) rotate(0deg); }
    }

    .manhole::before {
      content: "";
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 80%;
      height: 80%;
      background: 
        repeating-linear-gradient(45deg, transparent, transparent 8px, rgba(255,255,255,0.1) 8px, rgba(255,255,255,0.1) 10px),
        repeating-linear-gradient(-45deg, transparent, transparent 8px, rgba(255,255,255,0.1) 8px, rgba(255,255,255,0.1) 10px);
      border-radius: 50%;
    }
  </style>
</head>
<body>
  <!-- Fullscreen Button -->
  <button class="fullscreen-btn" id="fullscreenBtn" onclick="toggleFullscreen()">
    Turtle Power!
  </button>

  <!-- Background decorations -->
  <div class="pizza-slice">🍕</div>
  <div class="pizza-slice">🍕</div>
  <div class="pizza-slice">🍕</div>
  <div class="tmnt-logo">TMNT</div>

  <!-- Manhole entrance -->
  <div class="manhole" id="manhole"></div>

  <!-- Turtle chase sequence -->
  <div class="chase-container" id="chaseContainer">
    <div class="turtle"></div>
    <div class="turtle"></div>
    <div class="turtle"></div>
    <div class="turtle"></div>
    <div class="villain"></div>
    <div class="villain"></div>
  </div>

  <!-- Scoreboard Header -->
  <div class="header">
    <div class="event-name" id="eventName">Event 12 - Girls 200 IM</div>
    <div class="race-clock" id="raceClock">0:00.00</div>
  </div>

  <!-- Lane Results -->
  <div class="lanes-container" id="lanesContainer">
    <!-- Lanes populated by JavaScript -->
  </div>

  <!-- Footer -->
  <div class="footer">
    <div class="footer-item">
      <span class="footer-label">EV:</span>
      <span class="footer-value" id="eventNumber">12</span>
    </div>
    <div class="footer-item">
      <span class="footer-label">HT:</span>
      <span class="footer-value" id="heatNumber">3 of 4</span>
    </div>
    <div class="footer-item">
      <span class="footer-label">Lengths:</span>
      <span class="footer-value" id="lengths">4</span>
    </div>
    <div class="footer-item">
      <span class="footer-label">Record:</span>
      <span class="footer-value" id="record">2:03.45</span>
    </div>
  </div>

  <script>
    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
        document.getElementById('fullscreenBtn').classList.add('hidden');
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
          document.getElementById('fullscreenBtn').classList.remove('hidden');
        }
      }
    }

    // Hide fullscreen button when in fullscreen
    document.addEventListener('fullscreenchange', () => {
      const btn = document.getElementById('fullscreenBtn');
      if (document.fullscreenElement) {
        btn.classList.add('hidden');
      } else {
        btn.classList.remove('hidden');
      }
    });

    // F11 key handler
    document.addEventListener('keydown', (e) => {
      if (e.key === 'F11') {
        e.preventDefault();
        toggleFullscreen();
      }
    });

    // ===== SCOREBOARD FUNCTIONALITY =====
    function updateLanes(lanes) {
      const container = document.getElementById('lanesContainer');
      container.innerHTML = '';
      
      lanes.forEach((lane, index) => {
        const laneDiv = document.createElement('div');
        laneDiv.className = 'lane';
        if (lane.place === 1) laneDiv.classList.add('first-place');
        
        const placeHTML = lane.place 
          ? `<div class="place">${lane.place}</div>` 
          : `<div class="place empty">-</div>`;
        
        laneDiv.innerHTML = `
          <div class="lane-number">${lane.lane}</div>
          ${placeHTML}
          <div class="swimmer-name">${lane.name || 'Athlete Name'}</div>
          <div class="team">${lane.team || 'Team'}</div>
          <div class="split-time">${lane.split || ''}</div>
          <div class="final-time">${lane.time || ''}</div>
        `;
        
        // Stagger lane animations
        laneDiv.style.animationDelay = `${index * 0.08}s`;
        
        container.appendChild(laneDiv);
        
        // Trigger animation
        setTimeout(() => {
          laneDiv.classList.add('visible');
        }, 50 + (index * 80));
      });
    }

    // Demo lanes
    const demoLanes = [
      { lane: 1, name: 'Sarah Johnson', team: 'NOVA', split: '1:01.23', time: '2:08.45', place: null },
      { lane: 2, name: 'Emma Williams', team: 'RAYS', split: '59.87', time: '2:05.67', place: 3 },
      { lane: 3, name: 'Katie Martinez', team: 'TIDE', split: '58.34', time: '2:03.12', place: 1 },
      { lane: 4, name: 'Olivia Davis', team: 'WAVE', split: '59.12', time: '2:04.89', place: 2 },
      { lane: 5, name: 'Sophia Brown', team: 'HEAT', split: '1:00.45', time: '2:07.23', place: 4 },
      { lane: 6, name: 'Ava Garcia', team: 'BOLT', split: '1:01.89', time: '2:09.01', place: null },
      { lane: 7, name: 'Isabella Lopez', team: 'FAST', split: '1:02.34', time: '2:10.56', place: null },
      { lane: 8, name: 'Mia Rodriguez', team: 'FIRE', split: '1:00.78', time: '2:07.89', place: 5 },
    ];

    // Start
    updateLanes(demoLanes);

    // Function to run the chase
    function runChaseSequence() {
      const manhole = document.getElementById('manhole');
      const chase = document.getElementById('chaseContainer');
      
      // Reset chase
      chase.classList.remove('running');
      manhole.classList.remove('visible');
      
      // Show manhole
      setTimeout(() => {
        manhole.classList.add('visible');
        
        // Start chase 0.5s after manhole appears
        setTimeout(() => {
          chase.classList.add('running');
        }, 500);
      }, 100);
    }

    // Trigger turtle chase after lanes load
    setTimeout(runChaseSequence, 1500);

    // Listen for simulator commands
    window.addEventListener('message', (event) => {
      if (event.data.action === 'runChase') {
        runChaseSequence();
      }
    });
  </script>
</body>
</html>
