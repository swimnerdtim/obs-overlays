<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Swimnerd AI - Train Smarter</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    /* Hero Section - Full Screen */
    .hero {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: white;
      overflow: hidden;
    }

    /* Background Video/Image */
    .hero::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #001d3d 0%, #003566 50%, #000814 100%);
      z-index: 1;
    }

    .hero-bg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.4;
      z-index: 2;
    }

    /* Overlay gradient */
    .hero::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(180deg, 
        rgba(0,0,0,0.3) 0%, 
        rgba(0,0,0,0.5) 50%, 
        rgba(0,0,0,0.8) 100%
      );
      z-index: 3;
    }

    /* Navigation */
    nav {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      padding: 30px 60px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }

    .logo {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    nav a {
      color: rgba(255,255,255,0.9);
      text-decoration: none;
      font-size: 15px;
      font-weight: 500;
      transition: color 0.2s;
    }

    nav a:hover {
      color: #00d9ff;
    }

    /* Content */
    .hero-content {
      position: relative;
      z-index: 4;
      max-width: 900px;
      padding: 0 40px;
    }

    h1 {
      font-size: 72px;
      font-weight: 700;
      line-height: 1.1;
      margin-bottom: 24px;
      letter-spacing: -2px;
    }

    .subheadline {
      font-size: 24px;
      font-weight: 400;
      line-height: 1.5;
      margin-bottom: 48px;
      color: rgba(255,255,255,0.9);
    }

    .price {
      font-size: 32px;
      font-weight: 600;
      margin-bottom: 40px;
      color: #00d9ff;
    }

    .cta-button {
      display: inline-block;
      padding: 20px 60px;
      font-size: 18px;
      font-weight: 600;
      color: white;
      background: #00d9ff;
      border: none;
      border-radius: 6px;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 8px 24px rgba(0, 217, 255, 0.3);
    }

    .cta-button:hover {
      background: #00b8d9;
      transform: translateY(-2px);
      box-shadow: 0 12px 32px rgba(0, 217, 255, 0.4);
    }

    /* Features Section */
    .features {
      display: flex;
      gap: 40px;
      margin-top: 80px;
      justify-content: center;
    }

    .feature {
      text-align: center;
      max-width: 200px;
    }

    .feature-icon {
      font-size: 48px;
      margin-bottom: 12px;
    }

    .feature-text {
      font-size: 16px;
      color: rgba(255,255,255,0.8);
      line-height: 1.4;
    }

    /* Scroll indicator */
    .scroll-indicator {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 4;
      animation: bounce 2s infinite;
    }

    .scroll-indicator::before {
      content: '↓';
      font-size: 32px;
      color: rgba(255,255,255,0.6);
    }

    @keyframes bounce {
      0%, 100% { transform: translate(-50%, 0); }
      50% { transform: translate(-50%, 10px); }
    }

    /* Responsive */
    @media (max-width: 768px) {
      h1 {
        font-size: 48px;
      }
      
      .subheadline {
        font-size: 18px;
      }
      
      .price {
        font-size: 24px;
      }
      
      .features {
        flex-direction: column;
        align-items: center;
        gap: 30px;
      }
      
      nav {
        padding: 20px 30px;
      }
      
      .logo {
        font-size: 22px;
      }
    }
  </style>
</head>
<body>
  <!-- Hero Section -->
  <section class="hero">
    <!-- Background Image (replace with actual swimming image URL) -->
    <img 
      class="hero-bg" 
      src="https://images.unsplash.com/photo-1519315901367-f34ff9154487?q=80&w=2940&auto=format&fit=crop" 
      alt="Swimmer underwater"
    >
    
    <!-- Navigation -->
    <nav>
      <div class="logo">SWIMNERD</div>
      <a href="#login">Sign In</a>
    </nav>

    <!-- Hero Content -->
    <div class="hero-content">
      <h1>Train Like a Pro.<br>Race Like a Champion.</h1>
      
      <p class="subheadline">
        Get personalized AI coaching, technique analysis, and race strategy 
        designed by elite coaches. Everything you need to drop time.
      </p>
      
      <div class="price">$40/year</div>
      
      <a href="https://swimnerd.com" class="cta-button">
        START YOUR JOURNEY
      </a>

      <!-- Features -->
      <div class="features">
        <div class="feature">
          <div class="feature-icon">🏊</div>
          <div class="feature-text">AI-Powered Technique Analysis</div>
        </div>
        
        <div class="feature">
          <div class="feature-icon">📊</div>
          <div class="feature-text">Custom Training Plans</div>
        </div>
        
        <div class="feature">
          <div class="feature-icon">🎯</div>
          <div class="feature-text">Race Strategy Builder</div>
        </div>
      </div>
    </div>

    <!-- Scroll Indicator -->
    <div class="scroll-indicator"></div>
  </section>

  <!-- Additional sections can go here (testimonials, features breakdown, etc.) -->
</body>
</html>
